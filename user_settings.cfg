#############################################################################
#   User Macros
#############################################################################

[gcode_macro PRINT_START]
gcode:
    Frame_Light_ON
    Part_Light_ON
    G92 E0
    G90                       ; Use absolute coordinates
    BED_MESH_CLEAR

    {% set CURRENT_BED_TARGET = printer.heater_bed.target|float %}
    {% set BED_TEMP = params.BED_TEMP|default(CURRENT_BED_TARGET if CURRENT_BED_TARGET > 0 else 60)|float %}
    {% set BED_HEAT_SOAK_MINUTES = params.BED_HEAT_SOAK_MINUTES|default(0)|float %}
    {% set BED_MESH = params.BED_MESH|default('adaptive')|string %} ; One of: adaptive (default), full, default (or any other value as the bed mesh profile name), none
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set PURGE_HEIGHT = params.PURGE_HEIGHT|default(printer["gcode_macro _KAMP_Settings"].purge_height)|float %}
    {% set PURGE_TIP_DISTANCE = params.PURGE_TIP_DISTANCE|default(printer["gcode_macro _KAMP_Settings"].tip_distance)|float %}
    {% set PURGE_MARGIN = params.PURGE_MARGIN|default(printer["gcode_macro _KAMP_Settings"].purge_margin)|float %}
    {% set PURGE_LENGTH = params.PURGE_LENGTH|default(30)|float %}
    {% set PURGE_AMOUNT = params.PURGE_AMOUNT|default(printer["gcode_macro _KAMP_Settings"].purge_amount)|float %}
    {% set PURGE_FLOW_RATE = params.PURGE_FLOW_RATE|default(printer["gcode_macro _KAMP_Settings"].flow_rate)|float %}
    {% set PURGE_RETRACT = params.PURGE_RETRACT|default(0.8)|float %}
    {% set PURGE_UNRETRACT = params.PURGE_UNRETRACT|default(PURGE_RETRACT)|float %}

    SET_BED_TEMPERATURE TARGET={BED_TEMP}                           ; Heat Bed to target temp
    BED_TEMPERATURE_WAIT MINIMUM={BED_TEMP-2} MAXIMUM={BED_TEMP+4}  ; Waits until the bed reaches close to target
    {% if BED_HEAT_SOAK_MINUTES > 0 %}
    RESPOND MSG="Waiting {BED_HEAT_SOAK_MINUTES} minutes for the bed to settle."
    G4 P{BED_HEAT_SOAK_MINUTES * 60000}
    {% endif %}

    CG28

    {% if BED_MESH == 'full' %}
    BED_MESH_CALIBRATE
    {% elif BED_MESH == 'adaptive' %}
    BED_MESH_CALIBRATE ADAPTIVE=1
    {% elif BED_MESH != 'none' %}
    BED_MESH_PROFILE LOAD={BED_MESH}
    {% endif %}
    Smart_Park
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}   ; Set and heat the final extruder temperature
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP-4} MAXIMUM={EXTRUDER_TEMP+10}  ; Wait for extruder to reach near target temperature
    ORCA_LINE_PURGE PURGE_HEIGHT={PURGE_HEIGHT} PURGE_TIP_DISTANCE={PURGE_TIP_DISTANCE} PURGE_MARGIN={PURGE_MARGIN} PURGE_LENGTH={PURGE_LENGTH} PURGE_AMOUNT={PURGE_AMOUNT} PURGE_FLOW_RATE={PURGE_FLOW_RATE} PURGE_RETRACT={PURGE_RETRACT} PURGE_UNRETRACT={PURGE_UNRETRACT}
    G92 E0                                                          ; Zero the extruder position so the cleanup retract is predictable
    G1 Z2.0 F3000                                                   ; Move Z Axis up
    M117 Printing

[gcode_macro PRINT_END]
gcode:
    Frame_Light_OFF
    Part_Light_OFF
    M400                    ; wait for buffer to clear
    {% set CURRENT_BED_TARGET = printer.heater_bed.target|float %}
    {% set BED_TEMP = params.BED_TEMP|default(CURRENT_BED_TARGET if CURRENT_BED_TARGET > 0 else 0)|float %}
    TURN_OFF_HEATERS
    {% if BED_TEMP > 0 %}
    SET_BED_TEMPERATURE TARGET={BED_TEMP}   ; Keep bed at the print's bed temp, ready for next print
    {% endif %}
    G92 E0                  ; zero the extruder
    G91                     ; Relative positioning
    G1 E-2 F2700            ; Retract a bit
    G1 X5 Y5 F3000          ; Wipe out
    G1 E-2 Z0.2 F1600       ; Retract and raise Z
    G1 Z4 F3000             ; Raise Z more
    G90                     ; Absolute positioning
    G1 X0 Y315              ; Present print
    M107                    ; turn off fan
    M84                     ; turn off steppers
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    M117
    END_TUNE                ; Print End Beeper Jingle

[gcode_macro ORCA_LINE_PURGE]
description: Adaptive purge with separate line length and extrusion amount, controlled from PRINT_START
gcode:
    {% set travel_speed = (printer.toolhead.max_velocity) * 60 | float %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}
    {% set purge_height = params.PURGE_HEIGHT|default(0.8)|float %}
    {% set tip_distance = params.PURGE_TIP_DISTANCE|default(0)|float %}
    {% set purge_margin = params.PURGE_MARGIN|default(10)|float %}
    {% set purge_length = params.PURGE_LENGTH|default(30)|float %}
    {% set purge_amount = params.PURGE_AMOUNT|default(12)|float %}
    {% set flow_rate = params.PURGE_FLOW_RATE|default(8)|float %}
    {% set retract = params.PURGE_RETRACT|default(0.8)|float %}
    {% set unretract = params.PURGE_UNRETRACT|default(retract)|float %}
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}
    {% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}
    {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}
    {% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}
    {% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_length / 2), 0] | max) %}
    {% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_length / 2), 0] | max) %}
    {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}
    {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}
    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {% if cross_section < 5 %}
        {action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge, please set it to 5 or greater. Purge skipped.")}
    {% else %}
        {% if purge_y_origin > 0 %}
            {action_respond_info("Orca purge starting at {}, {}, purging {}mm of filament over {}mm, requested flow rate is {}mm3/s.".format(purge_x_center, purge_y_origin, purge_amount, purge_length, flow_rate))}
        {% else %}
            {action_respond_info("Orca purge starting at {}, {}, purging {}mm of filament over {}mm, requested flow rate is {}mm3/s.".format(purge_x_origin, purge_y_center, purge_amount, purge_length, flow_rate))}
        {% endif %}

        SAVE_GCODE_STATE NAME=Orca_Prepurge_State
        G92 E0
        G0 F{travel_speed}
        G90
        M83
        {% if purge_y_origin > 0 %}
            G0 X{purge_x_center} Y{purge_y_origin}
            G0 Z{purge_height}
            G1 E{tip_distance} F{purge_move_speed}
            G1 X{purge_x_center + purge_length} E{purge_amount} F{purge_move_speed}
            G1 E-{retract} F1200
            G0 X{purge_x_center + purge_length + 10} F{travel_speed}
            G1 E{unretract} F900
        {% else %}
            G0 X{purge_x_origin} Y{purge_y_center}
            G0 Z{purge_height}
            G1 E{tip_distance} F{purge_move_speed}
            G1 Y{purge_y_center + purge_length} E{purge_amount} F{purge_move_speed}
            G1 E-{retract} F1200
            G0 Y{purge_y_center + purge_length + 10} F{travel_speed}
            G1 E{unretract} F900
        {% endif %}
        G92 E0
        M82
        G0 Z{purge_height * 2} F{travel_speed}
        RESTORE_GCODE_STATE NAME=Orca_Prepurge_State
    {% endif %}
