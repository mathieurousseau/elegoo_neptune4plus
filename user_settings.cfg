#############################################################################
#   User Macros
#############################################################################

[gcode_macro PRINT_START]
gcode:
    Frame_Light_ON
    Part_Light_ON
    M220 S100                  ; Reset runtime speed override
    M221 S100                  ; Reset runtime extrusion override
    G92 E0
    G90                       ; Use absolute coordinates
    BED_MESH_CLEAR

    {% set CURRENT_BED_TARGET = printer.heater_bed.target|float %}
    {% set BED_TEMP = params.BED_TEMP|default(CURRENT_BED_TARGET if CURRENT_BED_TARGET > 0 else 60)|float %}
    {% set BED_HEAT_SOAK_MINUTES = params.BED_HEAT_SOAK_MINUTES|default(0)|float %}
    {% set BED_MESH = params.BED_MESH|default('adaptive')|string %} ; One of: adaptive (default), full, default (or any other value as the bed mesh profile name), none
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set PROBE_TEMP = params.PROBE_TEMP|default(160)|float %}
    {% set PROBE_HEAT_SOAK_MINUTES = params.PROBE_HEAT_SOAK_MINUTES|default(3)|float %}
    {% set KAMP_PARK = params.KAMP_PARK|default('disabled')|lower %}
    {% set RIGHT_PURGE = params.RIGHT_PURGE|default('disabled')|lower %}
    {% set LEFT_PURGE = params.LEFT_PURGE|default('enabled')|lower %}
    {% set TEMP_Z_OFFSET_BOTTOM = params.TEMP_Z_OFFSET_BOTTOM|default(printer["gcode_macro _APPLY_EXTRUDER_TEMP_Z_OFFSET"].temp_z_offset_bottom)|float %}
    {% set TEMP_Z_OFFSET_TOP = params.TEMP_Z_OFFSET_TOP|default(printer["gcode_macro _APPLY_EXTRUDER_TEMP_Z_OFFSET"].temp_z_offset_top)|float %}
    {% set TEMP_Z_OFFSET_HEIGHT = params.TEMP_Z_OFFSET_HEIGHT|default(printer["gcode_macro _APPLY_EXTRUDER_TEMP_Z_OFFSET"].temp_z_offset_height)|float %}

    # Snapshot the nozzle temperature before any heating, homing, or meshing.
    _APPLY_EXTRUDER_TEMP_Z_OFFSET TEMP_Z_OFFSET_BOTTOM={TEMP_Z_OFFSET_BOTTOM} TEMP_Z_OFFSET_TOP={TEMP_Z_OFFSET_TOP} TEMP_Z_OFFSET_HEIGHT={TEMP_Z_OFFSET_HEIGHT}

    SET_BED_TEMPERATURE TARGET={BED_TEMP}                           ; Heat bed and nozzle together
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={PROBE_TEMP}
    BED_TEMPERATURE_WAIT MINIMUM={BED_TEMP-2} MAXIMUM={BED_TEMP+4}  ; Waits until the bed reaches close to target
    {% if BED_HEAT_SOAK_MINUTES > 0 %}
    RESPOND MSG="Waiting {BED_HEAT_SOAK_MINUTES} minutes for the bed to settle."
    G4 P{BED_HEAT_SOAK_MINUTES * 60000}
    {% endif %}

    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={PROBE_TEMP-4} MAXIMUM={PROBE_TEMP+10}

    # Optional full preconditioning cycle using the right purge.
    {% if RIGHT_PURGE != 'disabled' %}
      G28
      BED_MESH_PROFILE LOAD=patch_reference
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP-4} MAXIMUM={EXTRUDER_TEMP+10}
      {% if RIGHT_PURGE == 'enabled' %}
      RIGHT_PURGE
      {% elif RIGHT_PURGE == 'movement_only' %}
      RIGHT_PURGE EXTRUDE=0
      {% endif %}

      # Complete the preconditioning print, then initialize a fresh print cycle.
      PRINT_END BED_TEMP={BED_TEMP}
      Frame_Light_ON
      Part_Light_ON
      M220 S100
      M221 S100
      G92 E0
      G90
      BED_MESH_CLEAR
      SET_BED_TEMPERATURE TARGET={BED_TEMP}
      BED_TEMPERATURE_WAIT MINIMUM={BED_TEMP-2} MAXIMUM={BED_TEMP+4}
    {% endif %}

    # Fresh print cycle after preconditioning.
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={PROBE_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={PROBE_TEMP-4} MAXIMUM={PROBE_TEMP+10}
    {% if PROBE_HEAT_SOAK_MINUTES > 0 %}
    RESPOND MSG="Waiting {PROBE_HEAT_SOAK_MINUTES} minutes for the toolhead to settle at probing temperature."
    G4 P{PROBE_HEAT_SOAK_MINUTES * 60000}
    {% endif %}
    G28
    {% if BED_MESH == 'full' %}
    BED_MESH_CALIBRATE
    {% elif BED_MESH == 'adaptive' %}
    BED_MESH_CALIBRATE ADAPTIVE=1
    {% elif BED_MESH != 'none' %}
    BED_MESH_PROFILE LOAD={BED_MESH}
    {% endif %}
    {% if KAMP_PARK == 'enabled' %}
    Smart_Park
    {% endif %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}   ; Set and heat the final extruder temperature
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP-4} MAXIMUM={EXTRUDER_TEMP+10}  ; Wait for extruder to reach near target temperature
    {% if LEFT_PURGE == 'enabled' %}
    LEFT_PURGE
    {% elif LEFT_PURGE == 'movement_only' %}
    LEFT_PURGE EXTRUDE=0
    {% endif %}
    G92 E0                                                          ; Zero the extruder position so the cleanup retract is predictable
    G1 Z2.0 F3000                                                   ; Move Z Axis up
    M117 Printing

[gcode_macro _APPLY_EXTRUDER_TEMP_Z_OFFSET]
description: Compensate cold-state Z clearance using extruder temperature as a proxy
variable_temp_z_offset_bottom: 60.0
variable_temp_z_offset_top: 160.0
variable_temp_z_offset_height: 0.09
gcode:
    {% set EXTRUDER_TEMP = printer.extruder.temperature|float %}
    {% set BOTTOM_TEMP = params.TEMP_Z_OFFSET_BOTTOM|default(temp_z_offset_bottom)|float %}
    {% set TOP_TEMP = params.TEMP_Z_OFFSET_TOP|default(temp_z_offset_top)|float %}
    {% set MAX_Z_ADJUST = params.TEMP_Z_OFFSET_HEIGHT|default(temp_z_offset_height)|float %}
    {% if TOP_TEMP <= BOTTOM_TEMP %}
      {action_raise_error("TEMP_Z_OFFSET_TOP must be greater than TEMP_Z_OFFSET_BOTTOM")}
    {% elif EXTRUDER_TEMP <= BOTTOM_TEMP %}
      {% set TEMP_Z_OFFSET = MAX_Z_ADJUST %}
    {% elif EXTRUDER_TEMP < TOP_TEMP %}
      {% set TEMP_Z_OFFSET = MAX_Z_ADJUST * (TOP_TEMP - EXTRUDER_TEMP) / (TOP_TEMP - BOTTOM_TEMP) %}
    {% else %}
      {% set TEMP_Z_OFFSET = 0.0 %}
    {% endif %}
    SET_GCODE_OFFSET Z_ADJUST={TEMP_Z_OFFSET}
    RESPOND PREFIX="TEMP_Z_OFFSET" MSG="temperature={EXTRUDER_TEMP|round(1)}C adjustment={TEMP_Z_OFFSET|round(4)}mm config: bottom={BOTTOM_TEMP}C top={TOP_TEMP}C height={MAX_Z_ADJUST}mm"

[gcode_macro PRINT_END]
gcode:
    Frame_Light_OFF
    Part_Light_OFF
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; Restore configured 35-minute timeout
    M400                    ; wait for buffer to clear
    {% set CURRENT_BED_TARGET = printer.heater_bed.target|float %}
    {% set BED_TEMP = params.BED_TEMP|default(CURRENT_BED_TARGET if CURRENT_BED_TARGET > 0 else 0)|float %}
    TURN_OFF_HEATERS
    {% if BED_TEMP > 0 %}
    SET_BED_TEMPERATURE TARGET={BED_TEMP}   ; Keep bed at the print's bed temp, ready for next print
    {% endif %}
    G92 E0                  ; zero the extruder
    G91                     ; Relative positioning
    G1 E-2 F2700            ; Retract a bit
    G1 X5 Y5 F3000          ; Wipe out
    G1 E-2 Z0.2 F1600       ; Retract and raise Z
    G1 Z4 F3000             ; Raise Z more
    G90                     ; Absolute positioning
    G1 X0 Y315              ; Present print
    M107                    ; turn off fan
    M84 X Y Z E             ; turn off all motion steppers
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    M117
    END_TUNE                ; Print End Beeper Jingle

[gcode_macro RIGHT_PURGE]
description: Fixed right-side nozzle prime line
gcode:
    {% set extrude = params.EXTRUDE|default(1)|int %}
    SAVE_GCODE_STATE NAME=Right_Purge_State
    G90
    M83
    G0 Z2 F3000
    G0 X270 Y10 F12000
    G0 Z0.8 F3000
    {% if extrude %}
    G1 X320 E12 F300
    G1 E-0.8 F1200
    G0 X325 F12000
    G1 E0.8 F900
    {% else %}
    G1 X320 F300
    G0 X325 F12000
    {% endif %}
    RESTORE_GCODE_STATE NAME=Right_Purge_State

[gcode_macro LEFT_PURGE]
description: Fixed left-side nozzle prime line
gcode:
    {% set extrude = params.EXTRUDE|default(1)|int %}
    SAVE_GCODE_STATE NAME=Left_Purge_State
    G90
    M83
    G0 Z2 F3000
    G0 X60 Y10 F12000
    G0 Z0.8 F3000
    {% if extrude %}
    G1 X10 E12 F300
    G1 E-0.8 F1200
    G0 X5 F12000
    G1 E0.8 F900
    {% else %}
    G1 X10 F300
    G0 X5 F12000
    {% endif %}
    RESTORE_GCODE_STATE NAME=Left_Purge_State

[gcode_macro REPORT_IDLE_TIMEOUT]
description: Report Klipper idle state and configured/runtime timeout values
gcode:
    RESPOND PREFIX="idle_timeout" MSG="state={printer.idle_timeout.state}, configured={printer.configfile.settings.idle_timeout.timeout}s, runtime={printer.idle_timeout.timeout}s, printing_time={printer.idle_timeout.printing_time}s"
